# main 정적 품질 게이트 — org 재사용 워크플로우 호출.
# 무거운 빌드/배포 금지(태그/배포는 deploy-*.yml). 설계: seorilabs/.github docs/ci-cd.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # org rn-static-checks.yml@main이 packages: read를 요구한다(GitHub Packages registry 지원).
  # 재사용 워크플로우 권한은 호출자 권한의 부분집합이어야 하므로 없으면 startup_failure가 난다.
  packages: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@main
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      package_manager: pnpm
      install_command: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
        fi
        pnpm install --ignore-scripts --frozen-lockfile
      check_command: |
        pnpm run lint
        pnpm run typecheck
        pnpm run test

  firebase-rules:
    name: Firebase Rules
    # private 저장소에서 GitHub-hosted 러너가 step 없이 즉시 실패해(과금 한도 또는 org 정책)
    # checks job과 동일하게 self-hosted ARM64로 라우팅한다. Temurin과 firestore emulator는 aarch64에서 동작한다.
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Test Firebase Rules
        run: pnpm run test:functions:rules
