# main 정적 품질 게이트 — org 재사용 워크플로우 호출.
# 무거운 빌드/배포 금지(태그/배포는 deploy-*.yml). 설계: seorilabs/.github docs/ci-cd.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      package_manager: pnpm
      install_command: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
        fi
        pnpm install --ignore-scripts --frozen-lockfile
      check_command: |
        pnpm run lint
        pnpm run typecheck
        pnpm run test

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Test Firebase Rules
        run: pnpm run test:functions:rules
