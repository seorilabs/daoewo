# Google Play(서명 AAB + 업로드) — ubuntu(x64). org 재사용 워크플로우 호출.
# contract: scripts/resolve-release-version.mjs, scripts/upload-google-play-internal.py,
#           apps/mobile/android/gradlew :app:bundleRelease, scripts/restore-mobile-firebase-config.mjs
name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        description: "true면 Google Play track에 업로드(false면 AAB 아티팩트만)"
        type: boolean
        default: false
      track:
        type: choice
        options: [internal, production]
        default: internal
      release_status:
        type: choice
        options: [draft, completed]
        default: completed
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      track:
        type: string
        default: internal
      release_status:
        type: string
        default: completed

permissions:
  contents: read
  id-token: write

jobs:
  google-play:
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}
      package_manager: pnpm
