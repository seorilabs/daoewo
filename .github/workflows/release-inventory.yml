name: Release Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Release Inventory
    runs-on: ${{ github.event.repository.private && 'seorilabs-x64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FUNCTIONS_REGION: ${{ vars.FUNCTIONS_REGION }}
      GOOGLE_PLAY_PRODUCT_IDS: ${{ vars.GOOGLE_PLAY_PRODUCT_IDS }}
      GOOGLE_PLAY_RTDN_TOPIC: ${{ vars.GOOGLE_PLAY_RTDN_TOPIC }}
      APP_STORE_APP_APPLE_ID: ${{ vars.APP_STORE_APP_APPLE_ID }}
      APP_STORE_PRODUCT_IDS: ${{ vars.APP_STORE_PRODUCT_IDS }}
      APP_STORE_IAP_ISSUER_ID: ${{ vars.APP_STORE_IAP_ISSUER_ID }}
      APP_STORE_IAP_KEY_ID: ${{ vars.APP_STORE_IAP_KEY_ID }}
      TOSS_FIREBASE_APP_ID: ${{ vars.TOSS_FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install release-check tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Restore Firebase release configuration
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          node scripts/restore-firebase-project.mjs --require
          node scripts/restore-mobile-firebase-config.mjs --all --require

      - name: Check Release Readiness
        env:
          # Static inventory에는 raw secret을 넘기지 않고 GitHub-side 존재 여부만 전달한다.
          APP_STORE_IAP_PRIVATE_KEY_CONFIGURED: ${{ secrets.APP_STORE_IAP_PRIVATE_KEY_BASE64 != '' }}
          APP_STORE_ROOT_CA_CERTIFICATES_CONFIGURED: ${{ secrets.APP_STORE_ROOT_CA_CERTIFICATES_BASE64_JSON != '' }}
        run: bash scripts/check_release_readiness.sh
