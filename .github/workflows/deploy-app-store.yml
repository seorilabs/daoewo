# App Store(Xcode archive + 업로드) — macos-26. org 재사용 워크플로우 호출.
# ios_scheme/workspace/bundle_id는 입력으로 받는다(템플릿에 가짜 기본값을 커밋하지 않음).
# 앱 설정 후: 이 caller의 with:에 기본값을 채우거나 dispatch/deploy-all에서 입력.
name: Deploy App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        description: "true면 App Store Connect 업로드(false면 xcarchive 아티팩트만)"
        type: boolean
        default: false
      ios_scheme:
        description: "Xcode scheme (필수)"
        type: string
        required: true
      ios_workspace:
        description: "Xcode workspace 경로(.xcworkspace) (필수)"
        type: string
        required: true
      ios_bundle_id:
        description: "iOS bundle id (필수)"
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      ios_scheme:
        type: string
        required: true
      ios_workspace:
        type: string
        required: true
      ios_bundle_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  app-store:
    uses: seorilabs/.github/.github/workflows/rn-deploy-app-store.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      ios_scheme: ${{ inputs.ios_scheme }}
      ios_workspace: ${{ inputs.ios_workspace }}
      ios_bundle_id: ${{ inputs.ios_bundle_id }}
      ios_dir: apps/mobile
      package_manager: pnpm
